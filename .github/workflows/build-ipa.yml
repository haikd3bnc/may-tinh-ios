name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project MayTinh.xcodeproj \
            -target MayTinh \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          test -d build/Release-iphoneos/MayTinh.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/MayTinh.app Payload/
          zip -qry MayTinh.ipa Payload
          ls -lh MayTinh.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayTinh-ipa
          path: MayTinh.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Máy tính – bản ${{ github.run_number }}
          body: |
            File IPA chưa ký (unsigned). Cài bằng Sideloadly, AltStore hoặc ESign/Feather — app sẽ được ký bằng Apple ID của bạn khi cài.
          files: MayTinh.ipa
